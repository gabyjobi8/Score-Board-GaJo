<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>التحكم بالمباراة</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="control-page">
  <div class="control-topbar">
    <a href="setup.html" class="small-btn" style="text-decoration:none;">⟲ مباراة جديدة</a>
    <div class="clock-display" id="clock-display">10:00</div>
    <div class="clock-controls">
      <button id="clock-toggle">ابدأ</button>
      <button id="clock-reset">إعادة</button>
    </div>
  </div>

  <div class="teams-row">
    <div class="team-panel" id="panel-a"></div>
    <div class="team-panel" id="panel-b"></div>
  </div>

  <div class="control-bottombar">
    <button class="undo-btn" id="undo-btn">تراجع (Undo)</button>
  </div>

  <div class="display-link-box" id="display-link-box"></div>
</div>

<div class="winner-banner" id="winner-banner" style="display:none;">
  <h2 id="winner-text"></h2>
  <button id="winner-new-game">مباراة جديدة</button>
</div>

<script src="js/state.js"></script>
<script src="js/match.js"></script>
<script src="js/control.js"></script>
</body>
</html>
